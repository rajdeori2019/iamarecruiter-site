name: Patch TMS tracker reliability source

on:
  push:
    paths:
      - '.github/workflows/patch-tracker-delivery-timeout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden tracker source
        run: python3 scripts/harden-tms-tracker.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-apps-script/TMSCheckoutTracker.gs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make TMS tracker writes and email delivery idempotent"
          git push
