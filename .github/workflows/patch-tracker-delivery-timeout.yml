name: Patch tracker payment fulfillment reliability

on:
  push:
    paths:
      - '.github/workflows/patch-tracker-delivery-timeout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic fulfillment patch
        run: python3 scripts/harden-payment-fulfillment.py
      - name: Validate JavaScript syntax
        run: node --check payments-bootstrap.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payments-bootstrap.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Harden post-payment tracking and delivery"
          git push
