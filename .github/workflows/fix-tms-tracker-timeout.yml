name: Fix TMS tracker timeout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-tms-tracker-timeout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Increase Apps Script tracker timeout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('payments-bootstrap.js')
          s = p.read_text()
          old = "const timeoutMs = action === 'send_delivery_email' ? 60000 : 8000;"
          new = "const timeoutMs = action === 'send_delivery_email' ? 60000 : 30000;"
          if old not in s:
              raise SystemExit('Expected timeout line not found; refusing to patch')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payments-bootstrap.js
          git rm .github/workflows/fix-tms-tracker-timeout.yml
          git commit -m "Increase TMS tracker webhook timeout"
          git push origin main
